<div
    id="modal-recolha-gerente"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.6);
        z-index:9999;
        align-items:center;
        justify-content:center;
    "
>

    <div
        style="
            background:white;
            width:90%;
            max-width:450px;
            padding:25px;
            border-radius:12px;
        "
    >

        <h4>
            Recolher dinheiro do gerente
        </h4>


        <p>

            <strong>Gerente:</strong>

            <span id="nome-gerente-recolha">
                -
            </span>

        </p>


        <p>

            <strong>Disponível:</strong>

            <span
                id="disponivel-gerente-recolha"
                style="color:#198754;font-weight:bold;"
            >
                0.00 MT
            </span>

        </p>


        <label>
            Valor a recolher
        </label>

        <input
            type="number"
            id="valor-recolha-gerente"
            class="form-control"
            min="0.01"
            step="0.01"
            placeholder="0.00"
        >


        <label class="mt-3">
            Observação
        </label>

        <textarea
            id="observacao-recolha-gerente"
            class="form-control"
            rows="3"
        ></textarea>


        <div
            class="mt-3"
            style="
                display:flex;
                gap:10px;
                justify-content:flex-end;
            "
        >

            <button
                type="button"
                class="btn btn-secondary"
                onclick="fecharRecolhaGerente()"
            >
                Cancelar
            </button>


            <button
                type="button"
                class="btn btn-danger"
                onclick="confirmarRecolhaGerente()"
            >
                Recolher
            </button>

        </div>

    </div>

</div>
