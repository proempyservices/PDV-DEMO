<script>

/* ==========================================================
   USUÁRIO LOGADO
   ========================================================== */

function obterUsuarioAtualInvestimento() {

    try {

        if (
            typeof usuarioAtual !== "undefined" &&
            usuarioAtual &&
            usuarioAtual.id
        ) {

            return usuarioAtual;

        }

    } catch (e) {}


    try {

        if (
            typeof usuario !== "undefined" &&
            usuario &&
            usuario.id
        ) {

            return usuario;

        }

    } catch (e) {}


    try {

        if (
            typeof usuarioLogado !== "undefined" &&
            usuarioLogado &&
            usuarioLogado.id
        ) {

            return usuarioLogado;

        }

    } catch (e) {}


    const chaves = [
        "usuarioAtual",
        "usuario",
        "usuarioLogado",
        "user",
        "currentUser"
    ];


    for (
        const chave of chaves
    ) {

        try {

            const dados =
                localStorage.getItem(chave);

            if (!dados) {
                continue;
            }

            const objeto =
                JSON.parse(dados);

            if (
                objeto &&
                objeto.id
            ) {

                return objeto;

            }

        } catch (e) {}

    }


    return null;
}


/* ==========================================================
   ID DO USUÁRIO
   ========================================================== */

function obterUsuarioIdInvestimento() {

    const usuario =
        obterUsuarioAtualInvestimento();


    if (
        usuario &&
        usuario.id
    ) {

        const id =
            Number(usuario.id);


        if (
            Number.isFinite(id) &&
            id > 0
        ) {

            return id;

        }

    }


    return null;
}


/* ==========================================================
   FORMATAR MT
   ========================================================== */

function formatarMT(valor) {

    const numero =
        Number(valor ?? 0);


    if (!Number.isFinite(numero)) {

        return "0,00 MT";

    }


    return numero.toLocaleString(
        "pt-MZ",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ) + " MT";

}


/* ==========================================================
   ABRIR MODAL
   ========================================================== */

async function abrirDetalhesDinheiroRecolhido() {

    const modal =
        document.getElementById(
            "modal-detalhes-dinheiro-recolhido"
        );


    if (!modal) {

        console.error(
            "Modal não encontrado."
        );

        return;

    }


    modal.style.display =
        "flex";


    /* ======================================================
       CARREGAR SOMENTE DINHEIRO RECOLHIDO
       ====================================================== */

    const lista =
        document.getElementById(
            "lista-dinheiro-recolhido-gerentes"
        );


    if (lista) {

        lista.innerHTML = `
            <div
                style="
                    text-align:center;
                    color:#6c757d;
                    padding:15px;
                "
            >
                Carregando...
            </div>
        `;

    }


    await carregarDinheiroRecolhido();


    /*
     * IMPORTANTE:
     *
     * NÃO chamamos automaticamente
     * carregarDadosInvestimentoManual().
     *
     * O usuário deve clicar em
     * "Ver dados".
     */

}


/* ==========================================================
   FECHAR MODAL
   ========================================================== */

function fecharDetalhesDinheiroRecolhido() {

    const modal =
        document.getElementById(
            "modal-detalhes-dinheiro-recolhido"
        );


    if (!modal) {
        return;
    }


    modal.style.display =
        "none";

}


/* ==========================================================
   CARREGAR DINHEIRO RECOLHIDO
   ========================================================== */

async function carregarDinheiroRecolhido() {

    const usuarioId =
        obterUsuarioIdInvestimento();


    if (!usuarioId) {

        mostrarErroDinheiroRecolhido(
            "Usuário não encontrado."
        );

        return;

    }


    try {

        const resposta =
            await fetch(
                `/caixa/dashboard/dinheiro-recolhido-gerentes?usuario_id=${encodeURIComponent(usuarioId)}`,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        if (!resposta.ok) {

            const texto =
                await resposta.text();


            throw new Error(
                texto ||
                `Erro HTTP ${resposta.status}`
            );

        }


        const dados =
            await resposta.json();


        mostrarDinheiroRecolhido(
            dados
        );


    } catch (erro) {

        console.error(
            "Erro dinheiro recolhido:",
            erro
        );


        mostrarErroDinheiroRecolhido(
            "Não foi possível carregar os dados."
        );

    }

}


/* ==========================================================
   MOSTRAR DINHEIRO RECOLHIDO
   ========================================================== */

function mostrarDinheiroRecolhido(
    dados
) {

    const lista =
        document.getElementById(
            "lista-dinheiro-recolhido-gerentes"
        );


    if (!lista) {
        return;
    }


    const admin =
        dados?.admin || {};


    const gerentes =
        Array.isArray(
            dados?.gerentes
        )
            ? dados.gerentes
            : [];


    let html = "";


    /* ======================================================
       ADMIN
       ====================================================== */

    html += `

        <div
            style="
                border:1px solid #dee2e6;
                border-radius:8px;
                padding:14px;
                margin-bottom:12px;
                background:#f8f9fa;
                min-width:300px;
            "
        >

            <div
                style="
                    font-size:18px;
                    font-weight:bold;
                    margin-bottom:12px;
                "
            >
                👤 ${escaparHTML(
                    admin.nome || "Admin"
                )}
            </div>


            <div
                style="
                    display:grid;
                    gap:7px;
                "
            >

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                    "
                >
                    <span>Retirado</span>

                    <strong>
                        ${formatarMT(admin.retirado)}
                    </strong>
                </div>


                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                    "
                >
                    <span>Recolhido</span>

                    <strong>
                        ${formatarMT(admin.recolhido)}
                    </strong>
                </div>


                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                    "
                >
                    <span>
                        Recebido dos gerentes
                    </span>

                    <strong>
                        ${formatarMT(
                            admin.recebido_gerentes
                        )}
                    </strong>
                </div>


                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                    "
                >
                    <span>Despesas</span>

                    <strong
                        style="color:#dc3545;"
                    >
                        ${formatarMT(admin.despesas)}
                    </strong>
                </div>


                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                    "
                >
                    <span>Lucros sacados</span>

                    <strong
                        style="color:#dc3545;"
                    >
                        ${formatarMT(
                            admin.lucros_sacados
                        )}
                    </strong>
                </div>


                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                        border-top:1px solid #dee2e6;
                        padding-top:9px;
                        margin-top:5px;
                        font-size:17px;
                    "
                >

                    <strong>Total</strong>

                    <strong
                        style="color:#198754;"
                    >
                        ${formatarMT(admin.total)}
                    </strong>

                </div>

            </div>

        </div>

    `;


    /* ======================================================
       GERENTES
       ====================================================== */

    if (gerentes.length > 0) {

        html += `

            <div
                style="
                    font-size:17px;
                    font-weight:bold;
                    margin-top:10px;
                    margin-bottom:10px;
                "
            >
                👥 Gerentes
            </div>

        `;


        gerentes.forEach(
            function(gerente) {

                html += `

                    <div
                        style="
                            border:1px solid #dee2e6;
                            border-radius:8px;
                            padding:13px;
                            margin-bottom:10px;
                            min-width:300px;
                        "
                    >

                        <div
                            style="
                                font-size:17px;
                                font-weight:bold;
                                margin-bottom:10px;
                            "
                        >
                            ${escaparHTML(
                                gerente.nome ||
                                "Gerente"
                            )}
                        </div>


                        <div
                            style="
                                display:grid;
                                gap:6px;
                            "
                        >

                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    gap:15px;
                                "
                            >
                                <span>
                                    Recolhido
                                </span>

                                <strong>
                                    ${formatarMT(
                                        gerente.recolhido
                                    )}
                                </strong>
                            </div>


                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    gap:15px;
                                "
                            >
                                <span>
                                    Despesas
                                </span>

                                <strong
                                    style="color:#dc3545;"
                                >
                                    ${formatarMT(
                                        gerente.despesas
                                    )}
                                </strong>
                            </div>


                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    gap:15px;
                                "
                            >
                                <span>
                                    Entregue ao admin
                                </span>

                                <strong>
                                    ${formatarMT(
                                        gerente.entregue
                                    )}
                                </strong>
                            </div>


                            <div
                                style="
                                    display:flex;
                                    justify-content:space-between;
                                    border-top:1px solid #dee2e6;
                                    padding-top:7px;
                                    margin-top:3px;
                                "
                            >

                                <strong>
                                    Total disponível
                                </strong>

                                <strong
                                    style="color:#198754;"
                                >
                                    ${formatarMT(
                                        gerente.total_recolhido
                                    )}
                                </strong>

                            </div>

                        </div>

                    </div>

                `;

            }
        );

    }


    /* ======================================================
       TOTAL GERAL
       ====================================================== */

    const totalGeral =
        Number(
            dados?.total_geral ?? 0
        );


    const totalElemento =
        document.getElementById(
            "total-detalhes-recolhido"
        );


    if (totalElemento) {

        totalElemento.textContent =
            formatarMT(totalGeral);

    }


    lista.innerHTML =
        html;

}


/* ==========================================================
   MOSTRAR MENSAGEM DE INVESTIMENTO
   ========================================================== */

function mostrarMensagemInvestimento(
    mensagem,
    tipo = "info"
) {

    const elemento =
        document.getElementById(
            "mensagem-investimento"
        );


    if (!elemento) {
        return;
    }


    elemento.style.display =
        "block";


    elemento.textContent =
        mensagem;


    if (tipo === "erro") {

        elemento.style.background =
            "#f8d7da";

        elemento.style.color =
            "#842029";

        elemento.style.border =
            "1px solid #f5c2c7";

    } else if (tipo === "sucesso") {

        elemento.style.background =
            "#d1e7dd";

        elemento.style.color =
            "#0f5132";

        elemento.style.border =
            "1px solid #badbcc";

    } else {

        elemento.style.background =
            "#cff4fc";

        elemento.style.color =
            "#055160";

        elemento.style.border =
            "1px solid #b6effb";

    }

}


/* ==========================================================
   LIMPAR MENSAGEM
   ========================================================== */

function limparMensagemInvestimento() {

    const elemento =
        document.getElementById(
            "mensagem-investimento"
        );


    if (!elemento) {
        return;
    }


    elemento.style.display =
        "none";

    elemento.textContent =
        "";

}


/* ==========================================================
   CARREGAR DADOS DE INVESTIMENTO
   MANUALMENTE
   ==========================================================

   ESTA É A FUNÇÃO DO BOTÃO:

   "VER DADOS"

   ROTA:

   /investimentos/dashboard/disponivel

   COM:

   ?usuario_id=ID
   ========================================================== */

async function carregarDadosInvestimentoManual() {

    const usuarioId =
        obterUsuarioIdInvestimento();


    console.log(
        "ID do usuário para investimento:",
        usuarioId
    );


    /* ======================================================
       VALIDAR USUÁRIO
       ====================================================== */

    if (!usuarioId) {

        mostrarMensagemInvestimento(
            "Não foi possível encontrar o ID do usuário logado.",
            "erro"
        );

        console.error(
            "Usuário não encontrado."
        );

        return;

    }


    /* ======================================================
       ELEMENTOS
       ====================================================== */

    const botao =
        document.getElementById(
            "btn-ver-dados-investimento"
        );


    const saldo =
        document.getElementById(
            "investimento-saldo-admin"
        );


    const lucro =
        document.getElementById(
            "investimento-lucro-reservado"
        );


    const investimentos =
        document.getElementById(
            "investimentos-realizados"
        );


    const disponivel =
        document.getElementById(
            "disponivel-investimento"
        );


    /* ======================================================
       ESTADO DE CARREGAMENTO
       ====================================================== */

    if (botao) {

        botao.disabled =
            true;

        botao.textContent =
            "⏳ A carregar...";

        botao.style.opacity =
            "0.7";

        botao.style.cursor =
            "wait";

    }


    limparMensagemInvestimento();


    if (saldo) {
        saldo.textContent =
            "Carregando...";
    }

    if (lucro) {
        lucro.textContent =
            "Carregando...";
    }

    if (investimentos) {
        investimentos.textContent =
            "Carregando...";
    }

    if (disponivel) {
        disponivel.textContent =
            "Carregando...";
    }


    try {

        /* ==================================================
           MONTAR URL
           ================================================== */

        const url =
            `/investimentos/dashboard/disponivel?usuario_id=${encodeURIComponent(usuarioId)}`;


        console.log(
            "Chamando rota de investimento:",
            url
        );


        /* ==================================================
           CHAMAR API
           ================================================== */

        const resposta =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "Accept":
                            "application/json"
                    },

                    cache:"no-store"
                }
            );


        console.log(
            "Status da rota investimento:",
            resposta.status
        );


        /* ==================================================
           LER RESPOSTA
           ================================================== */

        const texto =
            await resposta.text();


        console.log(
            "Resposta da rota investimento:",
            texto
        );


        let dados = {};


        try {

            dados =
                texto
                    ? JSON.parse(texto)
                    : {};

        } catch (erroJSON) {

            console.error(
                "Resposta não é JSON:",
                erroJSON
            );

            throw new Error(
                "O servidor não devolveu JSON válido."
            );

        }


        /* ==================================================
           ERRO HTTP
           ================================================== */

        if (!resposta.ok) {

            let mensagem =
                `Erro HTTP ${resposta.status}`;


            if (
                dados &&
                dados.detail
            ) {

                if (
                    typeof dados.detail ===
                    "string"
                ) {

                    mensagem =
                        dados.detail;

                } else {

                    mensagem =
                        JSON.stringify(
                            dados.detail
                        );

                }

            }


            throw new Error(
                mensagem
            );

        }


        /* ==================================================
           MOSTRAR RESPOSTA NO CONSOLE
           ================================================== */

        console.log(
            "Dados de investimento recebidos:",
            dados
        );


        /* ==================================================
           PEGAR VALORES
           ==================================================

           Esperado:

           {
               saldo_admin,
               lucro_saque_reservado,
               investimentos_realizados,
               disponivel_investimento
           }

           Também aceitamos 0 normalmente.
           ================================================== */

        const saldoValor =
            Number(
                dados.saldo_admin ?? 0
            );


        const lucroValor =
            Number(
                dados.lucro_saque_reservado ?? 0
            );


        const investimentosValor =
            Number(
                dados.investimentos_realizados ?? 0
            );


        const disponivelValor =
            Number(
                dados.disponivel_investimento ?? 0
            );


        /* ==================================================
           ATUALIZAR SALDO
           ================================================== */

        if (saldo) {

            saldo.textContent =
                formatarMT(
                    saldoValor
                );

        }


        /* ==================================================
           ATUALIZAR LUCRO
           ================================================== */

        if (lucro) {

            lucro.textContent =
                formatarMT(
                    lucroValor
                );

        }


        /* ==================================================
           ATUALIZAR INVESTIMENTOS
           ================================================== */

        if (investimentos) {

            investimentos.textContent =
                formatarMT(
                    investimentosValor
                );

        }


        /* ==================================================
           ATUALIZAR DISPONÍVEL
           ================================================== */

        if (disponivel) {

            disponivel.textContent =
                formatarMT(
                    disponivelValor
                );

        }


        /* ==================================================
           HABILITAR/DESABILITAR INVESTIR
           ================================================== */

        atualizarEstadoBotaoInvestir(
            disponivelValor
        );


        /* ==================================================
           SUCESSO
           ================================================== */

        mostrarMensagemInvestimento(
            "Dados de investimento carregados com sucesso.",
            "sucesso"
        );


    } catch (erro) {

        console.error(
            "ERRO AO CARREGAR INVESTIMENTO:",
            erro
        );


        /* ==================================================
           MOSTRAR ERRO NOS CAMPOS
           ================================================== */

        if (saldo) {
            saldo.textContent =
                "--";
        }

        if (lucro) {
            lucro.textContent =
                "--";
        }

        if (investimentos) {
            investimentos.textContent =
                "--";
        }

        if (disponivel) {
            disponivel.textContent =
                "--";
        }


        /* ==================================================
           DESABILITAR INVESTIMENTO
           ================================================== */

        atualizarEstadoBotaoInvestir(
            0
        );


        /* ==================================================
           MOSTRAR ERRO
           ================================================== */

        mostrarMensagemInvestimento(
            erro.message ||
            "Não foi possível carregar os dados de investimento.",
            "erro"
        );

    } finally {

        /* ==================================================
           RESTAURAR BOTÃO
           ================================================== */

        if (botao) {

            botao.disabled =
                false;

            botao.textContent =
                "🔄 Ver dados";

            botao.style.opacity =
                "1";

            botao.style.cursor =
                "pointer";

        }

    }

}


/* ==========================================================
   ESTADO DO BOTÃO INVESTIR
   ========================================================== */

function atualizarEstadoBotaoInvestir(
    valorDisponivel
) {

    const botao =
        document.getElementById(
            "btn-abrir-investimento"
        );


    if (!botao) {
        return;
    }


    const valor =
        Number(
            valorDisponivel ?? 0
        );


    if (
        !Number.isFinite(valor) ||
        valor <= 0
    ) {

        botao.disabled =
            true;

        botao.style.opacity =
            "0.5";

        botao.style.cursor =
            "not-allowed";

        return;

    }


    botao.disabled =
        false;

    botao.style.opacity =
        "1";

    botao.style.cursor =
        "pointer";

}


/* ==========================================================
   ABRIR FORMULÁRIO
   ========================================================== */

function abrirFormularioInvestimento() {

    const botao =
        document.getElementById(
            "btn-abrir-investimento"
        );


    if (
        botao &&
        botao.disabled
    ) {

        mostrarMensagemInvestimento(
            "Primeiro clique em \"Ver dados\" para consultar o valor disponível.",
            "info"
        );

        return;

    }


    const formulario =
        document.getElementById(
            "formulario-investimento"
        );


    if (!formulario) {
        return;
    }


    formulario.style.display =
        "block";


    const input =
        document.getElementById(
            "valor-investimento"
        );


    if (input) {

        input.focus();

    }

}


/* ==========================================================
   CANCELAR INVESTIMENTO
   ========================================================== */

function cancelarInvestimento() {

    const formulario =
        document.getElementById(
            "formulario-investimento"
        );


    if (formulario) {

        formulario.style.display =
            "none";

    }


    const valor =
        document.getElementById(
            "valor-investimento"
        );


    const descricao =
        document.getElementById(
            "descricao-investimento"
        );


    const observacao =
        document.getElementById(
            "observacao-investimento"
        );


    if (valor) {
        valor.value = "";
    }


    if (descricao) {
        descricao.value = "";
    }


    if (observacao) {
        observacao.value = "";
    }

}


/* ==========================================================
   REALIZAR INVESTIMENTO
   ========================================================== */

async function realizarInvestimento() {

    const usuarioId =
        obterUsuarioIdInvestimento();


    if (!usuarioId) {

        mostrarMensagemInvestimento(
            "Usuário não encontrado.",
            "erro"
        );

        return;

    }


    const inputValor =
        document.getElementById(
            "valor-investimento"
        );


    const inputDescricao =
        document.getElementById(
            "descricao-investimento"
        );


    const inputObservacao =
        document.getElementById(
            "observacao-investimento"
        );


    const valor =
        Number(
            inputValor?.value || 0
        );


    const descricao =
        (
            inputDescricao?.value ||
            ""
        ).trim();


    const observacao =
        (
            inputObservacao?.value ||
            ""
        ).trim();


    /* ======================================================
       VALIDAR VALOR
       ====================================================== */

    if (
        !Number.isFinite(valor) ||
        valor <= 0
    ) {

        mostrarMensagemInvestimento(
            "Digite um valor de investimento válido.",
            "erro"
        );

        inputValor?.focus();

        return;

    }


    /* ======================================================
       VALIDAR DESCRIÇÃO
       ====================================================== */

    if (!descricao) {

        mostrarMensagemInvestimento(
            "Digite a descrição do investimento.",
            "erro"
        );

        inputDescricao?.focus();

        return;

    }



    /* ======================================================
       BOTÃO
       ====================================================== */

    const botao =
        document.getElementById(
            "btn-confirmar-investimento"
        );


    if (botao) {

        botao.disabled =
            true;

        botao.textContent =
            "A processar...";

    }


    try {

        const resposta =
            await fetch(
                "/investimentos/",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({

                        usuario_id:
                            usuarioId,

                        valor:
                            valor,

                        descricao:
                            descricao,

                        observacao:
                            observacao

                    })
                }
            );


        const dados =
            await resposta
                .json()
                .catch(
                    () => ({})
                );


        if (!resposta.ok) {

            let mensagem =
                "Não foi possível realizar o investimento.";


            if (
                dados &&
                dados.detail
            ) {

                if (
                    typeof dados.detail ===
                    "string"
                ) {

                    mensagem =
                        dados.detail;

                } else {

                    mensagem =
                        JSON.stringify(
                            dados.detail
                        );

                }

            }


            throw new Error(
                mensagem
            );

        }


        /* ==================================================
           SUCESSO
           ================================================== */

        mostrarMensagemInvestimento(
            "Investimento realizado com sucesso!",
            "sucesso"
        );


        cancelarInvestimento();


        /* ==================================================
           ATUALIZAR INVESTIMENTOS
           ================================================== */

        await carregarDadosInvestimentoManual();


        /* ==================================================
           ATUALIZAR DINHEIRO RECOLHIDO
           ================================================== */

        await carregarDinheiroRecolhido();


    } catch (erro) {

        console.error(
            "Erro ao realizar investimento:",
            erro
        );


        mostrarMensagemInvestimento(
            erro.message ||
            "Erro ao realizar investimento.",
            "erro"
        );


    } finally {

        if (botao) {

            botao.disabled =
                false;

            botao.textContent =
                "Confirmar investimento";

        }

    }

}
/* ==========================================================
   MOSTRAR ERRO DINHEIRO
   ========================================================== */

function mostrarErroDinheiroRecolhido(
    mensagem
) {

    const lista =
        document.getElementById(
            "lista-dinheiro-recolhido-gerentes"
        );


    if (!lista) {
        return;
    }


    lista.innerHTML = `

        <div
            style="
                color:#dc3545;
                text-align:center;
                padding:15px;
            "
        >
            ${escaparHTML(mensagem)}
        </div>

    `;

}


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escaparHTML(
    valor
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(
            valor ?? ""
        );


    return div.innerHTML;

}


/* ==========================================================
   FECHAR CLICANDO FORA
   ========================================================== */

document.addEventListener(
    "click",
    function(event) {

        const modal =
            document.getElementById(
                "modal-detalhes-dinheiro-recolhido"
            );


        if (!modal) {
            return;
        }


        if (
            event.target === modal
        ) {

            fecharDetalhesDinheiroRecolhido();

        }

    }
);


/* ==========================================================
   ENTER NO VALOR
   ========================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Enter"
        ) {
            return;
        }


        const input =
            document.getElementById(
                "valor-investimento"
            );


        if (
            document.activeElement ===
            input
        ) {

            event.preventDefault();

            realizarInvestimento();

        }

    }
);

</script>
