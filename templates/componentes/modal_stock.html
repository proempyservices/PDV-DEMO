<!-- MODAL STOCK -->

<div id="stock-panel"
     class="usuarios-modal"
     style="display:none;">


    <div class="dashboard-card usuarios-box">



        <div class="card-header">



            <h4>
                Gestão de Stock
            </h4>





            <button
                class="btn btn-danger"
                onclick="fecharStock()">



                <i class="bi bi-x-lg"></i>



            </button>




        </div>







        <div style="overflow-x:auto;">





            <table class="table table-hover">






                <thead>





                    <tr>





                        <th>
                            ID
                        </th>



                        <th>
                            Produto
                        </th>



                        <th>
                            Categoria
                        </th>



                        <th>
                            Quantidade
                        </th>



                        <th>
                            Stock Mínimo
                        </th>



                        <th>
                            Estado
                        </th>



                        <th>
                            Ação
                        </th>





                    </tr>





                </thead>







                <tbody id="lista-stock">





                </tbody>








            </table>







        </div>






    </div>






</div>
