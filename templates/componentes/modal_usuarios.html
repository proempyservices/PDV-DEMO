<!-- MODAL USUÁRIOS -->

<div id="usuarios-panel" class="usuarios-modal" style="display:none;">


    <div class="dashboard-card usuarios-box">


        <div class="card-header">


            <h4>
                Gestão de Usuários
            </h4>


            <button
                class="btn btn-danger"
                onclick="fecharUsuarios()">

                <i class="bi bi-x-lg"></i>


            </button>


        </div>




        <button
            class="btn btn-primary mb-3"
            onclick="mostrarFormularioUsuario()">


            <i class="bi bi-person-plus"></i>

            Novo Usuário


        </button>






        <!-- FORMULÁRIO -->


        <div id="form-usuario" style="display:none;">



            <input
                id="usuario-id"
                type="hidden">





            <input
                id="usuario-nome"
                class="form-control mb-2"
                placeholder="Nome completo">





            <input
                id="usuario-email"
                type="email"
                class="form-control mb-2"
                placeholder="Email">





            <input
                id="usuario-senha"
                type="password"
                class="form-control mb-2"
                placeholder="Senha">






            <select
                id="usuario-tipo"
                class="form-control mb-3">


                <option value="admin">
                    Admin
                </option>


                <option value="gerente">
                    Gerente
                </option>


                <option value="vendedor">
                    Vendedor
                </option>


            </select>






            <div class="d-flex gap-2">


                <button
                    class="btn btn-success"
                    onclick="salvarUsuario()">


                    <i class="bi bi-check-lg"></i>

                    Salvar


                </button>





                <button
                    class="btn btn-secondary"
                    onclick="fecharFormularioUsuario()">


                    Cancelar


                </button>


            </div>




        </div>






        <hr>







        <!-- LISTA DE USUÁRIOS -->


        <table class="table table-hover">



            <thead>



                <tr>



                    <th>
                        Nome
                    </th>



                    <th>
                        Email
                    </th>



                    <th>
                        Tipo
                    </th>



                    <th>
                        Ações
                    </th>



                </tr>



            </thead>





            <tbody id="lista-usuarios">


            </tbody>





        </table>






    </div>





</div>
